<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackChan Hub Wi-Fi</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6677; --card: #ffffff;
    --line: #d9dde5; --accent: #2f6fe4; --ok: #1f8a4c; --err: #c23a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --fg: #e6e9ef; --muted: #98a1b3; --card: #1c2029;
      --line: #2e3442; --accent: #6d9cf5; --ok: #52c285; --err: #ec6f6f;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.55 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input { box-sizing: border-box; width: 100%; padding: 8px 10px; font: inherit;
          color: var(--fg); background: var(--bg); border: 1px solid var(--line);
          border-radius: 6px; }
  code, .token { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .token { display: block; padding: 8px 10px; background: var(--bg);
           border: 1px dashed var(--line); border-radius: 6px; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
         white-space: pre-wrap; min-height: 72px; max-height: 220px; overflow: auto;
         background: var(--bg); border-radius: 6px; padding: 8px; margin: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>StackChan Hub Wi-Fi 設定</h1>
  <p class="lead">CoreS3 本体の USB-C を Mac につなぎ、起動画面でタップせずに使います（Chrome / Edge）。</p>

  <section>
    <h2>1. 接続</h2>
    <div class="row">
      <button id="connect">シリアルポートを選ぶ</button>
      <button id="status" class="secondary" disabled>状態を確認</button>
    </div>
  </section>

  <section>
    <h2>2. Wi-Fi</h2>
    <label for="ssid">SSID（2.4 GHz）</label>
    <input id="ssid" autocomplete="off">
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="off">
    <label>OTA トークン（自動生成）</label>
    <span class="token" id="token"></span>
    <p class="lead" style="margin:8px 0 0">
      送信後、リポジトリ直下の <code>.ota-token</code> にこのトークンを保存してください
      （<code>tools/ota.sh</code> が読みます）。
    </p>
    <div class="row">
      <button id="send" disabled>送信して再起動</button>
      <button id="copy" class="secondary">トークンをコピー</button>
    </div>
  </section>

  <section>
    <h2>応答</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
const logBox = document.getElementById('log');
const tokenBox = document.getElementById('token');
let port = null;
let writer = null;

function log(text, cls) {
  const line = document.createElement('div');
  line.textContent = text;
  if (cls) line.className = cls;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

function newToken() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}
tokenBox.textContent = newToken();

async function readLoop() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  let buffered = '';
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffered += value;
      let newline;
      while ((newline = buffered.indexOf('\n')) >= 0) {
        const line = buffered.slice(0, newline).replace(/\r$/, '');
        buffered = buffered.slice(newline + 1);
        // The console also carries firmware logs; show only command replies.
        if (/^(ok|error|status)\b/.test(line)) {
          log(line, line.startsWith('error') ? 'err' : 'ok');
        }
      }
    }
  } catch (e) {
    log('切断されました: ' + e.message, 'err');
  }
}

async function send(line) {
  await writer.write(new TextEncoder().encode(line + '\n'));
}

document.getElementById('connect').onclick = async () => {
  if (!('serial' in navigator)) {
    log('このブラウザは Web Serial に対応していません（Chrome / Edge を使ってください）', 'err');
    return;
  }
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    readLoop();
    document.getElementById('send').disabled = false;
    document.getElementById('status').disabled = false;
    log('接続しました');
  } catch (e) {
    log('接続できません: ' + e.message, 'err');
  }
};

document.getElementById('status').onclick = () => send('status');

document.getElementById('send').onclick = async () => {
  const ssid = document.getElementById('ssid').value;
  const password = document.getElementById('password').value;
  if (!ssid || /[\t\n]/.test(ssid + password)) {
    log('SSID を入力してください（タブと改行は使えません）', 'err');
    return;
  }
  await send(['wifi', ssid, password, tokenBox.textContent].join('\t'));
};

document.getElementById('copy').onclick = async () => {
  await navigator.clipboard.writeText(tokenBox.textContent);
  log('トークンをコピーしました');
};
</script>
</body>
</html>
